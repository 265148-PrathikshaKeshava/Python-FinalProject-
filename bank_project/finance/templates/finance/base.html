<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finance Calculators</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }
        .sidebar {
            height: 100%;
            padding-top: 20px;
            border-right: 1px solid #ddd;
        }
        .nav-link.active {
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 sidebar bg-light">
            <h5 class="px-3">Calculators</h5>
            <ul class="nav flex-column px-3">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">EMI Calculator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'sip_calculator' %}">SIP Calculator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'fd_calculator' %}">FD Calculator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'rd_calculator' %}">RD Calculator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'retirement_savings_estimator' %}">Retirement Estimator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'loan_eligibility_estimator' %}">Loan Eligibility</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'credit_card_interest_calculator' %}">Credit Card Interest</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'taxable_income_calculator' %}">Taxable Income</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'simple_budget_planner' %}">Budget Planner</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'net_worth_calculator' %}">Net Worth Calculator</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'loan_eligibility_estimator' %}">Loan Eligibility</a></li>

            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 p-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>
</body>
</html>
