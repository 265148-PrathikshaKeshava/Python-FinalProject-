<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bank Login - Finance Tools</title>

    <!-- Meta tags for better SEO and accessibility -->
    <meta name="description" content="Secure login page for Finance Tools. Manage your banking and financial tools with ease.">
    <meta name="keywords" content="login, bank, finance, secure login, banking tools">

    <style>
        /* General Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2196F3, #00bcd4);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Form container styling */
        .login-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Bank name styling */
        .bank-name {
            font-size: 32px;
            font-weight: bold;
            color: #2196F3;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .login-container h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
        }

        /* Form input fields */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.6);
        }

        /* Submit Button */
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateX(5px);
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.6);
        }

        /* Arrow Effect */
        button::after {
            content: '→';
            margin-left: 10px;
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        button:hover::after {
            transform: translateX(5px);
        }

        /* Error message styling */
        .error {
            color: red;
            font-size: 14px;
            margin-top: 12px;
            font-weight: 500;
        }

        /* Link for Signup */
        p {
            font-size: 14px;
            color: #555;
        }

        p a {
            color: #007bff;
            text-decoration: none;
            transition: text-decoration 0.3s ease;
        }

        p a:hover {
            text-decoration: underline;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .modal-content button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-content button:hover {
            background-color: #0056b3;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
                width: 90%;
            }

            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Centered Form -->
    <div class="login-container">
        <!-- Bank name instead of logo -->
        <div class="bank-name">U.ST Global BANK</div>
        <h2>Login to Your Account</h2>

        <form method="POST">
            {% csrf_token %}
            
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <!-- Display error message if login fails -->
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>.</p>

        </form>
    </div>

    <!-- Modal for Error -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <h3>Error!</h3>
            <p>Invalid credentials. Please try again.</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // Modal handling
        function showErrorModal() {
            document.getElementById('errorModal').style.display = 'flex';
            document.getElementById('errorModal').style.opacity = '1';
        }

        function closeModal() {
            document.getElementById('errorModal').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('errorModal').style.display = 'none';
            }, 300); // After fade-out
        }

        // Trigger modal if error occurs
        {% if error %}
            showErrorModal();
        {% endif %}
    </script>

</body>

</html>
